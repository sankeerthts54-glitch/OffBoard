AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  offboard
  
  Sample SAM Template for offboard

Globals:
  Function:
    Runtime: python3.11
    Architectures:
      - x86_64
    Environment:
      Variables:
        AWS_SAM_LOCAL: "true"

Resources:
  OffboardApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"

  OffboardAccountsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
        - AttributeName: account_id
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
        - AttributeName: account_id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: StatusIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: session_id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  ScanFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/scan/
      Handler: app.lambda_handler
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref OffboardAccountsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OffboardAccountsTable
      Events:
        ScanApi:
          Type: Api
          Properties:
            RestApiId: !Ref OffboardApi
            Path: /scan
            Method: post

  ClassifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/classify/
      Handler: app.lambda_handler
      MemorySize: 512
      Timeout: 60
      Environment:
        Variables:
          TABLE_NAME: !Ref OffboardAccountsTable
          BEDROCK_MODEL_ID: anthropic.claude-3-haiku-20240307-v1:0
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OffboardAccountsTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"
      Events:
        ClassifyApi:
          Type: Api
          Properties:
            RestApiId: !Ref OffboardApi
            Path: /classify
            Method: post

  ActionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/action/
      Handler: app.lambda_handler
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref OffboardAccountsTable
          STATE_MACHINE_ARN: !Ref CancelWorkflowStateMachine
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OffboardAccountsTable
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt CancelWorkflowStateMachine.Name
      Events:
        ActionApi:
          Type: Api
          Properties:
            RestApiId: !Ref OffboardApi
            Path: /action
            Method: post

  StatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/status/
      Handler: app.lambda_handler
      MemorySize: 256
      Timeout: 15
      Environment:
        Variables:
          TABLE_NAME: !Ref OffboardAccountsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref OffboardAccountsTable
      Events:
        StatusApi:
          Type: Api
          Properties:
            RestApiId: !Ref OffboardApi
            Path: /status/{session_id}
            Method: get

  OffboardNotificationTopic:
    Type: AWS::SNS::Topic

  NotifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/notify/
      Handler: app.lambda_handler
      MemorySize: 256
      Timeout: 15
      Environment:
        Variables:
          TABLE_NAME: !Ref OffboardAccountsTable
          SNS_TOPIC_ARN: !Ref OffboardNotificationTopic
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OffboardAccountsTable
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource: "*"
      Events:
        SNSEvent:
          Type: SNS
          Properties:
            Topic: !Ref OffboardNotificationTopic

  MockCancelFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/mock_cancel/
      Handler: app.lambda_handler
      MemorySize: 128
      Timeout: 10

  CancelWorkflowStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      DefinitionUri: statemachines/cancel_workflow.asl.json
      DefinitionSubstitutions:
        MockCancelFunctionArn: !GetAtt MockCancelFunction.Arn
        NotifyFunctionArn: !GetAtt NotifyFunction.Arn
        TableName: !Ref OffboardAccountsTable
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref MockCancelFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref NotifyFunction
        - DynamoDBCrudPolicy:
            TableName: !Ref OffboardAccountsTable
        - Statement:
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref OffboardNotificationTopic

  RescanScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: rate(24 hours)
      State: DISABLED
      Targets:
        - Arn: !GetAtt ScanFunction.Arn
          Id: ScanFunctionTarget

Outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL for Prod stage"
    Value: !Sub "https://${OffboardApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  TableName:
    Description: "DynamoDB Table Name"
    Value: !Ref OffboardAccountsTable
  StateMachineArn:
    Description: "Cancel Workflow State Machine ARN"
    Value: !Ref CancelWorkflowStateMachine
